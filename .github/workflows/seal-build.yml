name: seal-build

# Authored by Seal: the bcpg-fips source baseline (official sources jar + reconstructed pom.xml) ships no CI.
# Builds target/bcpg-fips-1.0.7.1.jar with the pom's own recipe (Java 5 bytecode, -g:none, original manifest)
# and runs the JUnit suite under src/test/java against the bc-fips 1.0.2.5 (BCFIPS) provider.
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: "Surefire -Dtest selector (e.g. SealPBEEncryptedDataTest); empty runs the full suite"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Install Maven 3.3.9
        run: |
          curl -fsSL https://archive.apache.org/dist/maven/maven-3/3.3.9/binaries/apache-maven-3.3.9-bin.tar.gz -o /tmp/maven.tar.gz
          sudo tar -xzf /tmp/maven.tar.gz -C /opt
          echo "/opt/apache-maven-3.3.9/bin" >> "$GITHUB_PATH"

      - name: Toolchain versions
        run: |
          mvn -v
          java -version

      - name: Build and test
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn -B package -Dtest="${{ inputs.test-filter }}" -DfailIfNoTests=false
          else
            mvn -B package
          fi

      - name: Test results
        if: always()
        run: |
          for f in target/surefire-reports/*.txt; do
            [ -f "$f" ] && cat "$f"
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bcpg-fips-1.0.7.1
          path: target/bcpg-fips-1.0.7.1.jar
          if-no-files-found: error
